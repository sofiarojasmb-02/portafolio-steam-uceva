  <style>
/* ==========================================================================
   DESIGN SYSTEM - CENTRO DE PROTOTIPADO & STEAM UCEVA
   Estética: Dark Tech, Neón Cyan -> Magenta -> Naranja, Hexagonal & Glass
   ========================================================================== */

:root {
  /* Color Palette - Neon Cyber Dark */
  --bg-primary: #040711;
  --bg-secondary: #080d1e;
  --bg-tertiary: #0e152e;
  --bg-card: rgba(14, 21, 46, 0.7);
  --bg-card-hover: rgba(20, 31, 68, 0.85);
  --bg-glass: rgba(10, 16, 35, 0.65);
  --bg-glass-heavy: rgba(5, 9, 22, 0.92);

  /* Neon Gradients & Accents */
  --neon-cyan: #00f0ff;
  --neon-cyan-glow: rgba(0, 240, 255, 0.4);
  --neon-purple: #9d00ff;
  --neon-magenta: #ff007f;
  --neon-magenta-glow: rgba(255, 0, 127, 0.4);
  --neon-orange: #ff5500;
  --neon-orange-glow: rgba(255, 85, 0, 0.4);
  --neon-green: #00ff88;

  /* Gradients */
  --grad-primary: linear-gradient(135deg, #00f0ff 0%, #9d00ff 50%, #ff007f 100%);
  --grad-warm: linear-gradient(135deg, #ff007f 0%, #ff5500 100%);
  --grad-cyan-purple: linear-gradient(135deg, #00f0ff 0%, #9d00ff 100%);
  --grad-dark-card: linear-gradient(180deg, rgba(20, 30, 65, 0.6) 0%, rgba(8, 14, 32, 0.9) 100%);
  --grad-glow-border: linear-gradient(135deg, rgba(0, 240, 255, 0.6), rgba(157, 0, 255, 0.6), rgba(255, 0, 127, 0.6));

  /* Typography */
  --text-main: #f0f4fc;
  --text-secondary: #a2b4d6;
  --text-muted: #62749d;
  --text-cyan: #00f0ff;
  --text-magenta: #ff4da6;

  /* Fonts */
  --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-display: 'Outfit', 'Space Grotesk', var(--font-sans);
  --font-mono: 'JetBrains Mono', monospace;

  /* Borders & Shadows */
  --border-subtle: rgba(0, 240, 255, 0.15);
  --border-active: rgba(0, 240, 255, 0.5);
  --shadow-neon-cyan: 0 0 25px rgba(0, 240, 255, 0.25);
  --shadow-neon-magenta: 0 0 25px rgba(255, 0, 127, 0.25);
  --shadow-card: 0 10px 30px -10px rgba(0, 0, 0, 0.7);

  /* Spacing & Layout */
  --nav-height: 76px;
  --container-max: 1280px;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;

  /* Transitions */
  --transition-fast: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  --transition-normal: 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  --transition-slow: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

/* ==========================================================================
   Global Reset & Base
   ========================================================================== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  color-scheme: dark;
  font-size: 16px;
}

body {
  background-color: var(--bg-primary);
  color: var(--text-main);
  font-family: var(--font-sans);
  line-height: 1.6;
  overflow-x: hidden;
  position: relative;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Futuristic background pattern */
body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-image: 
    radial-gradient(circle at 15% 20%, rgba(0, 240, 255, 0.07) 0%, transparent 40%),
    radial-gradient(circle at 85% 75%, rgba(157, 0, 255, 0.08) 0%, transparent 45%),
    radial-gradient(circle at 50% 50%, rgba(255, 0, 127, 0.05) 0%, transparent 50%),
    linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 100% 100%, 48px 48px, 48px 48px;
  pointer-events: none;
  z-index: -1;
}

/* Custom Cyber Scrollbar */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: var(--bg-primary);
}

::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, var(--neon-cyan), var(--neon-purple));
  border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
  background: linear-gradient(180deg, var(--neon-cyan), var(--neon-magenta));
}

/* Links & Typography helpers */
a {
  color: inherit;
  text-decoration: none;
  transition: color var(--transition-fast);
}

h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-display);
  font-weight: 700;
  letter-spacing: -0.02em;
  color: #ffffff;
  line-height: 1.2;
}

img, video {
  max-width: 100%;
  height: auto;
  display: block;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
}

/* ==========================================================================
   Utility Classes & Design Primitives
   ========================================================================== */
.container {
  width: 100%;
  max-width: var(--container-max);
  margin: 0 auto;
  padding: 0 24px;
}

.text-gradient {
  background: var(--grad-primary);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  display: inline-block;
}

.text-gradient-warm {
  background: var(--grad-warm);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  display: inline-block;
}

.text-cyan {
  color: var(--neon-cyan);
}

.text-magenta {
  color: var(--neon-magenta);
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 14px;
  border-radius: 30px;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  border: 1px solid var(--border-subtle);
  background: rgba(0, 240, 255, 0.06);
  color: var(--neon-cyan);
  backdrop-filter: blur(10px);
}

.badge-warm {
  border-color: rgba(255, 85, 0, 0.3);
  background: rgba(255, 85, 0, 0.08);
  color: #ff8c42;
}

.badge-purple {
  border-color: rgba(157, 0, 255, 0.3);
  background: rgba(157, 0, 255, 0.08);
  color: #c975ff;
}

.badge-green {
  border-color: rgba(0, 255, 136, 0.3);
  background: rgba(0, 255, 136, 0.08);
  color: var(--neon-green);
}

/* Glassmorphism Cards */
.glass-panel {
  background: var(--bg-card);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  transition: all var(--transition-normal);
  position: relative;
  overflow: hidden;
}

.glass-panel::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.5), transparent);
  opacity: 0.6;
}

.glass-panel:hover {
  border-color: var(--border-active);
  box-shadow: 0 14px 40px -10px rgba(0, 240, 255, 0.18), var(--shadow-card);
  transform: translateY(-4px);
}

/* Hexagonal / Cyber Accent Cut */
.tech-cut-corner {
  clip-path: polygon(
    0 0,
    calc(100% - 18px) 0,
    100% 18px,
    100% 100%,
    18px 100%,
    0 calc(100% - 18px)
  );
}

/* Buttons */
.btn-cyber-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px 28px;
  background: linear-gradient(135deg, #00f0ff 0%, #9d00ff 100%);
  color: #040711;
  font-weight: 700;
  font-size: 0.95rem;
  letter-spacing: 0.02em;
  border-radius: var(--radius-md);
  box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
  transition: all var(--transition-normal);
  position: relative;
  overflow: hidden;
}

.btn-cyber-primary:hover {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 0 30px rgba(0, 240, 255, 0.7), 0 0 15px rgba(157, 0, 255, 0.5);
  color: #000;
}

.btn-cyber-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 13px 26px;
  background: rgba(14, 21, 46, 0.8);
  border: 1px solid var(--border-active);
  color: #ffffff;
  font-weight: 600;
  font-size: 0.95rem;
  border-radius: var(--radius-md);
  backdrop-filter: blur(10px);
  transition: all var(--transition-normal);
}

.btn-cyber-secondary:hover {
  background: rgba(0, 240, 255, 0.12);
  border-color: var(--neon-cyan);
  box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
  color: var(--neon-cyan);
  transform: translateY(-2px);
}

.btn-cyber-print {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 20px;
  background: rgba(255, 0, 127, 0.12);
  border: 1px solid rgba(255, 0, 127, 0.4);
  color: #ff4da6;
  font-weight: 600;
  font-size: 0.85rem;
  border-radius: 30px;
  transition: all var(--transition-normal);
}

.btn-cyber-print:hover {
  background: rgba(255, 0, 127, 0.25);
  border-color: var(--neon-magenta);
  color: #ffffff;
  box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
  transform: translateY(-2px);
}

/* Section Header standard */
.section-header {
  text-align: center;
  margin-bottom: 56px;
  position: relative;
}

.section-header .section-subtitle {
  font-family: var(--font-mono);
  color: var(--neon-cyan);
  font-size: 0.85rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  margin-bottom: 12px;
  display: block;
}

.section-header .section-title {
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 800;
  margin-bottom: 16px;
}

.section-header .section-desc {
  max-width: 680px;
  margin: 0 auto;
  color: var(--text-secondary);
  font-size: 1.05rem;
}

/* Section padding */
section {
  padding: 96px 0;
  position: relative;
}

/* ==========================================================================
   ANIMATIONS & MICROINTERACTIONS
   ========================================================================== */

@keyframes pulseGlowCyan {
  0%, 100% {
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.3), 0 0 30px rgba(0, 240, 255, 0.1);
  }
  50% {
    box-shadow: 0 0 30px rgba(0, 240, 255, 0.6), 0 0 50px rgba(0, 240, 255, 0.25);
  }
}

@keyframes pulseGlowMagenta {
  0%, 100% {
    box-shadow: 0 0 15px rgba(255, 0, 127, 0.3);
  }
  50% {
    box-shadow: 0 0 30px rgba(255, 0, 127, 0.7), 0 0 45px rgba(157, 0, 255, 0.3);
  }
}

@keyframes floatSlow {
  0%, 100% {
    transform: translateY(0px) rotate(0deg);
  }
  50% {
    transform: translateY(-12px) rotate(1.5deg);
  }
}

@keyframes scanline {
  0% {
    transform: translateY(-100%);
  }
  100% {
    transform: translateY(1000%);
  }
}

@keyframes blinkCursor {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

@keyframes radarSweep {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes gradShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(24px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes zoomIn {
  from {
    opacity: 0;
    transform: scale(0.95);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* Applied animation utility classes */
.animate-float {
  animation: floatSlow 6s ease-in-out infinite;
}

.animate-pulse-cyan {
  animation: pulseGlowCyan 3s ease-in-out infinite;
}

.animate-pulse-magenta {
  animation: pulseGlowMagenta 3s ease-in-out infinite;
}

.typewriter-cursor {
  display: inline-block;
  width: 3px;
  height: 1.1em;
  background-color: var(--neon-cyan);
  vertical-align: middle;
  margin-left: 4px;
  animation: blinkCursor 0.9s infinite;
}

.fade-in-up {
  animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.modal-enter {
  animation: zoomIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* Scanning Line Effect for Tech Cards */
.scan-line-overlay {
  position: relative;
  overflow: hidden;
}

.scan-line-overlay::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.8), transparent);
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}

.scan-line-overlay:hover::after {
  opacity: 1;
  animation: scanline 2.5s linear infinite;
}

/* Reduced Motion preference */
@media (prefers-reduced-motion: reduce) {
  *, ::before, ::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* ==========================================================================
   PRINT STYLES (@media print) - DOSSIER EJECUTIVO PDF
   ========================================================================== */

@media print {
  /* Enforce exact background colors and gradients */
  *, *::before, *::after {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
    color-adjust: exact !important;
  }

  html, body {
    background-color: #040711 !important;
    color: #f0f4fc !important;
    font-size: 11pt !important;
    line-height: 1.4 !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  /* Hide interactive/non-printable elements */
  .no-print,
  .navbar-container,
  .btn-cyber-primary,
  .btn-cyber-secondary,
  .btn-cyber-print,
  .filter-bar,
  .modal-overlay,
  .typewriter-cursor,
  .mobile-menu-toggle,
  .scan-line-overlay::after {
    display: none !important;
  }

  /* Show print-only elements */
  .print-only {
    display: block !important;
  }

  /* Page setup */
  @page {
    size: letter portrait;
    margin: 1.5cm 1.2cm;
  }

  /* Avoid breaking elements inside cards */
  .project-card,
  .glass-panel,
  .team-card,
  .capability-card,
  .impact-card,
  .section-header,
  .hero-stats-grid,
  .break-inside-avoid {
    break-inside: avoid !important;
    page-break-inside: avoid !important;
    margin-bottom: 24px !important;
  }

  /* Reorganize sections for paper */
  section {
    padding: 30px 0 !important;
    page-break-after: auto;
  }

  .container {
    max-width: 100% !important;
    padding: 0 10px !important;
  }

  /* Ensure project grid fits 2 clean columns in print */
  .projects-grid {
    display: grid !important;
    grid-template-columns: repeat(2, 1fr) !important;
    gap: 20px !important;
  }

  /* Card styles in print */
  .project-card {
    background: #0a1024 !important;
    border: 1px solid rgba(0, 240, 255, 0.4) !important;
    box-shadow: none !important;
  }

  .project-card .card-media {
    height: 180px !important;
  }

  /* Hide GIFs and force static posters in print */
  .card-media img.gif-media {
    display: none !important;
  }

  .card-media img.poster-media {
    display: block !important;
  }

  /* High contrast text */
  h1, h2, h3, h4 {
    color: #ffffff !important;
  }

  p, span {
    color: #cbd5e1 !important;
  }

  .text-cyan {
    color: #00f0ff !important;
  }

  .text-magenta {
    color: #ff007f !important;
  }

  .text-gradient, .text-gradient-warm {
    -webkit-text-fill-color: #00f0ff !important;
  }

  /* Header banner for print */
  .print-dossier-header {
    display: block !important;
    border-bottom: 2px solid #00f0ff;
    padding-bottom: 15px;
    margin-bottom: 25px;
  }

  .print-dossier-header .brand-title {
    font-size: 18pt;
    font-weight: 800;
    color: #ffffff;
  }

  .print-dossier-header .brand-sub {
    font-size: 10pt;
    color: #00f0ff;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
}

/* Screen defaults for print-only classes */
.print-only {
  display: none;
}

/* ==========================================================================
   RESPONSIVE BREAKPOINTS (Mobile-First)
   ========================================================================== */

/* Mobile Phones (≤ 480px) */
@media (max-width: 480px) {
  :root {
    --nav-height: 64px;
  }

  .container {
    padding: 0 16px;
  }

  section {
    padding: 60px 0;
  }

  .section-header {
    margin-bottom: 36px;
  }

  .section-header .section-title {
    font-size: 1.75rem;
  }

  .hero-title {
    font-size: 2.2rem !important;
  }

  .hero-stats-grid {
    grid-template-columns: 1fr 1fr !important;
    gap: 12px !important;
  }

  .projects-grid {
    grid-template-columns: 1fr !important;
    gap: 20px !important;
  }

  .team-grid {
    grid-template-columns: 1fr !important;
    gap: 16px !important;
  }

  .capabilities-grid {
    grid-template-columns: 1fr !important;
  }

  .modal-content {
    width: 95% !important;
    max-height: 92vh !important;
    padding: 20px !important;
  }

  .modal-body-grid {
    grid-template-columns: 1fr !important;
  }

  .navbar-nav {
    display: none;
  }
}

/* Tablets & Small Laptops (481px - 768px) */
@media (min-width: 481px) and (max-width: 768px) {
  .projects-grid {
    grid-template-columns: repeat(2, 1fr) !important;
    gap: 20px !important;
  }

  .hero-stats-grid {
    grid-template-columns: repeat(2, 1fr) !important;
  }

  .team-grid {
    grid-template-columns: repeat(2, 1fr) !important;
  }

  .capabilities-grid {
    grid-template-columns: 1fr !important;
  }

  .modal-body-grid {
    grid-template-columns: 1fr !important;
  }
}

/* Medium Desktops (769px - 1024px) */
@media (min-width: 769px) and (max-width: 1024px) {
  .projects-grid {
    grid-template-columns: repeat(2, 1fr) !important;
    gap: 24px !important;
  }

  .team-grid {
    grid-template-columns: repeat(3, 1fr) !important;
  }
}

/* Large Screens (≥ 1025px) */
@media (min-width: 1025px) {
  .projects-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
  }

  .team-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }
}

/* Ultra-Wide Screens (≥ 1440px) */
@media (min-width: 1440px) {
  .container {
    max-width: 1380px;
  }

  .projects-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 32px;
  }
}

  </style>

    const TYPEWRITER_PHRASES = [
      'Realidades Extendidas (VR / AR / MR)',
      'Inteligencia Artificial & Modelos AA',
      'Gemelos Digitales & Fotogrametría 3D',
      'Aeronáutica & Drones No Tripulados',

    function Hero({ onPrintPdf }) {
      const [currentPhraseIndex, setCurrentPhraseIndex] = useState(0);
      const [currentText, setCurrentText] = useState('');
      const [isDeleting, setIsDeleting] = useState(false);
      const canvasRef = useRef(null);

      useEffect(() => {
        const fullPhrase = TYPEWRITER_PHRASES[currentPhraseIndex];
        const typingSpeed = isDeleting ? 40 : 80;
        const timer = setTimeout(() => {
          if (!isDeleting) {
            setCurrentText(fullPhrase.substring(0, currentText.length + 1));
            if (currentText === fullPhrase) setTimeout(() => setIsDeleting(true), 2000);
          } else {
            setCurrentText(fullPhrase.substring(0, currentText.length - 1));
            if (currentText === '') {
              setIsDeleting(false);
              setCurrentPhraseIndex((prev) => (prev + 1) % TYPEWRITER_PHRASES.length);
            }
          }
        }, typingSpeed);
        return () => clearTimeout(timer);
      }, [currentText, isDeleting, currentPhraseIndex]);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let width = (canvas.width = canvas.parentElement.offsetWidth);
        let height = (canvas.height = canvas.parentElement.offsetHeight);

        const particleCount = Math.min(50, Math.floor(width / 24));
        const particles = [];
        for (let i = 0; i < particleCount; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.8,
            vy: (Math.random() - 0.5) * 0.8,
            radius: Math.random() * 2 + 1,
            color: Math.random() > 0.5 ? '#00f0ff' : '#9d00ff'
          });
        }

        const render = () => {
          ctx.clearRect(0, 0, width, height);
          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.x += p.vx; p.y += p.vy;
            if (p.x < 0 || p.x > width) p.vx *= -1;
            if (p.y < 0 || p.y > height) p.vy *= -1;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.fill();
            for (let j = i + 1; j < particles.length; j++) {
              const p2 = particles[j];
              const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
              if (dist < 100) {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = `rgba(0, 240, 255, ${0.15 * (1 - dist / 100)})`;
                ctx.stroke();
              }
            }
          }
          animationFrameId = requestAnimationFrame(render);
        };
        render();

        return () => cancelAnimationFrame(animationFrameId);
      }, []);

      const scrollTo = (id) => {
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      };

      return (
        <section id="hero" className="hero-section">
          <canvas ref={canvasRef} className="hero-canvas" />
          <div className="container hero-container">
            <div className="hero-badge-wrap">
              <div className="badge badge-cyan animate-pulse-cyan">
                <span className="live-dot" />
                <span>INDUSTRIA 4.0 &amp; 5.0 • UCEVA</span>
              </div>
            </div>

            <h1 className="hero-title">
              Centro de Prototipado <br />
              <span className="text-gradient">&amp; STEAM UCEVA</span>
            </h1>

            <div className="hero-typewriter-box">
              <span className="typewriter-prefix">&gt; Especialidad: </span>
              <span className="typewriter-text">{currentText}</span>
              <span className="typewriter-cursor" />
            </div>

            <p className="hero-desc">
              Ecosistema de investigación aplicada, fabricación digital y tecnologías inmersivas de la <strong>Unidad Central del Valle del Cauca</strong>. Transformamos retos de la comunidad académica y el sector productivo en soluciones tangibles.
            </p>

            <div className="hero-cta-group">
              <button onClick={() => scrollTo('projects')} className="btn-cyber-primary">
                <span>Explorar Proyectos</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                  <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
              </button>
              <button onClick={() => scrollTo('capabilities')} className="btn-cyber-secondary">
                <span>Ver Equipamiento</span>
              </button>
            </div>

            <div className="hero-stats-grid glass-panel">
              <div className="stat-card">
                <span className="stat-number text-gradient">14+</span>
                <span className="stat-label">Proyectos de I+D</span>
              </div>
              <div className="stat-divider" />
              <div className="stat-card">
                <span className="stat-number text-cyan">8</span>
                <span className="stat-label">Líneas Tecnológicas</span>
              </div>
              <div className="stat-divider" />
              <div className="stat-card">
                <span className="stat-number text-magenta">18+</span>
                <span className="stat-label">Investigadores &amp; Red</span>
              </div>
              <div className="stat-divider" />
              <div className="stat-card">
                <span className="stat-number text-gradient-warm">100%</span>
                <span className="stat-label">Prototipado In-House</span>
              </div>
            </div>
          </div>
        </section>
      );
    }

                <span key={idx} className="tech-badge">{tech}</span>

            <div className="card-footer-action">

        </div>

    function ProjectGrid({ projects, onSelectProject }) {
      const [selectedCategory, setSelectedCategory] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');

      const categories = [
        { id: 'ALL', label: 'Todos' },
        { id: 'VR', label: 'Realidad Virtual (VR)' },
        { id: 'AR', label: 'Realidad Aumentada (AR)' },
        { id: 'MR', label: 'Realidad Mixta (MR)' },
        { id: 'IA', label: 'Inteligencia Artificial' },
        { id: '3D', label: 'Fotogrametría & 3D' },
        { id: 'Drones', label: 'Aeronáutica & Drones' },
        { id: 'IoT', label: 'Electrónica & IoT' },
        { id: 'FAB', label: 'Fabricación Digital' }
      ];

      const filtered = useMemo(() => {
        return projects.filter(item => {
          let matchCat = true;
          if (selectedCategory !== 'ALL') {
            if (selectedCategory === 'VR') matchCat = item.category.includes('VR');
            else if (selectedCategory === 'AR') matchCat = item.category.includes('AR');
            else if (selectedCategory === 'MR') matchCat = item.category.includes('MR');
            else if (selectedCategory === 'IA') matchCat = item.category.includes('IA');
            else if (selectedCategory === '3D') matchCat = item.category.includes('Fotogrametría') || item.category.includes('360');
            else if (selectedCategory === 'Drones') matchCat = item.category.includes('Aeronáutica');
            else if (selectedCategory === 'IoT') matchCat = item.category.includes('IoT') || item.category.includes('Electrónica');
            else if (selectedCategory === 'FAB') matchCat = item.category.includes('Diseño') || item.category.includes('Fabricación');
          }
          let matchSearch = true;
          if (searchQuery.trim() !== '') {
            const q = searchQuery.toLowerCase();
            matchSearch = item.title.toLowerCase().includes(q) || item.fullDesc.toLowerCase().includes(q) || item.techStack.some(t => t.toLowerCase().includes(q));
          }
          return matchCat && matchSearch;
        });
      }, [projects, selectedCategory, searchQuery]);

      return (
        <section id="projects" className="projects-section">
          <div className="container">
            <div className="section-header">
              <span className="section-subtitle">&lt; PORTAFOLIO DE I+D+i /&gt;</span>

            </div>

            <div className="filter-controls-wrap no-print">
              <div className="filter-tabs-scroll">
                <div className="filter-tabs">
                  {categories.map(cat => (
                    <button
                      key={cat.id}
                      onClick={() => setSelectedCategory(cat.id)}
                      className={`filter-btn ${selectedCategory === cat.id ? 'active' : ''}`}
                    >
                      {cat.label}
                    </button>
                  ))}
                </div>
              </div>
              <div className="filter-search-row">
                <div className="search-input-box">
                  <input
                    type="text"
                    placeholder="Buscar por tecnología, nombre o rol..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="search-input"
                  />
                </div>
                <div className="projects-counter-badge">
                  Mostrando: <strong>{filtered.length}</strong> proyectos
                </div>
              </div>
            </div>

            <div className="projects-grid">
              {filtered.map(p => (
                <ProjectCard key={p.id} project={p} onSelect={onSelectProject} />
              ))}
            </div>
          </div>
        </section>
      );

    function ProjectModal({ project, onClose }) {
      const [mediaIdx, setMediaIdx] = useState(0);
      useEffect(() => {
        const handleKeyDown = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [onClose]);

      if (!project) return null;

      const mediaList = [];
      if (project.gif) mediaList.push({ type: 'gif', src: project.gif, label: 'Demo GIF' });
      if (project.gallery) {
        project.gallery.forEach((img, i) => mediaList.push({ type: 'img', src: img, label: `Img ${i+1}` }));
      }

      const current = mediaList[mediaIdx] || mediaList[0];

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-content glass-panel modal-enter" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <div className="modal-header-meta">
                <span className="badge badge-cyan">{project.category}</span>
                <span className="badge badge-purple">{project.tag}</span>
                <span className="slide-num-pill">Slide {project.slide}</span>
              </div>
              <button className="modal-close-btn" onClick={onClose}>✕</button>
            </div>

            <h2 className="modal-title">{project.title}</h2>

            <div className="modal-body-grid">
              <div className="modal-media-col">
                <div className="modal-media-main-box">
                  <img src={current.src} alt={project.title} className="modal-display-media" onError={(e) => { e.target.src = 'assets/projects/slide_render_1.jpg'; }} />
                </div>
                {mediaList.length > 1 && (
                  <div className="modal-thumbs-row">
                    {mediaList.map((m, i) => (
                      <button key={i} onClick={() => setMediaIdx(i)} className={`thumb-btn ${mediaIdx === i ? 'active' : ''}`}>
                        <img src={m.src} alt="" className="thumb-img" onError={(e) => { e.target.src = 'assets/projects/slide_render_1.jpg'; }} />
                      </button>
                    ))}

              <div className="modal-details-col">

                    {project.techStack.map((t, idx) => (
                      <span key={idx} className="tech-pill-modal">{t}</span>

              </div>
            </div>
          </div>
        </div>
      );

                  <ul style={{ listStyle: 'none', display: 'flex', flexDirection: 'column', gap: '8px', color: 'var(--text-secondary)', fontSize: '0.9rem' }}>
