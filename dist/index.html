<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro de Prototipado &amp; STEAM UCEVA | Portafolio Tecnológico e Innovación</title>
  <meta name="description" content="Portafolio tecnológico de alta tecnología del Centro de Prototipado y STEAM de la Unidad Central del Valle del Cauca (UCEVA). Desarrollos en VR, AR, MR, IA, Gemelos Digitales, Drones y Fabricación Digital.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@400;600;700;800;900&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
  
  <style>
/* ==========================================================================
   DESIGN SYSTEM - CENTRO DE PROTOTIPADO & STEAM UCEVA
   Estética: Dark Tech, Neón Cyan -> Magenta/Púrpura -> Naranja, Hexagonal & Glass
   ========================================================================== */

:root {
  /* Color Palette - Neon Cyber Dark */
  --bg-primary: #040711;
  --bg-secondary: #080d1e;
  --bg-tertiary: #0e152e;
  --bg-card: rgba(14, 21, 46, 0.7);
  --bg-card-hover: rgba(20, 31, 68, 0.85);
  --bg-glass: rgba(10, 16, 35, 0.7);
  --bg-glass-heavy: rgba(5, 9, 22, 0.95);

  /* Neon Gradients & Accents */
  --neon-cyan: #00f0ff;
  --neon-cyan-glow: rgba(0, 240, 255, 0.4);
  --neon-purple: #9d00ff;
  --neon-magenta: #ff007f;
  --neon-magenta-glow: rgba(255, 0, 127, 0.4);
  --neon-orange: #ff5500;
  --neon-orange-glow: rgba(255, 85, 0, 0.4);
  --neon-green: #00ff88;

  /* Gradients */
  --grad-primary: linear-gradient(135deg, #00f0ff 0%, #9d00ff 50%, #ff007f 100%);
  --grad-warm: linear-gradient(135deg, #ff007f 0%, #ff5500 100%);
  --grad-cyan-purple: linear-gradient(135deg, #00f0ff 0%, #9d00ff 100%);
  --grad-dark-card: linear-gradient(180deg, rgba(20, 30, 65, 0.6) 0%, rgba(8, 14, 32, 0.9) 100%);
  --grad-glow-border: linear-gradient(135deg, rgba(0, 240, 255, 0.6), rgba(157, 0, 255, 0.6), rgba(255, 0, 127, 0.6));

  /* Typography */
  --text-main: #f0f4fc;
  --text-secondary: #a2b4d6;
  --text-muted: #62749d;
  --text-cyan: #00f0ff;
  --text-magenta: #ff4da6;

  /* Fonts */
  --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-display: 'Outfit', 'Space Grotesk', var(--font-sans);
  --font-mono: 'JetBrains Mono', monospace;

  /* Borders & Shadows */
  --border-subtle: rgba(0, 240, 255, 0.15);
  --border-active: rgba(0, 240, 255, 0.5);
  --shadow-neon-cyan: 0 0 25px rgba(0, 240, 255, 0.25);
  --shadow-neon-magenta: 0 0 25px rgba(255, 0, 127, 0.25);
  --shadow-card: 0 10px 30px -10px rgba(0, 0, 0, 0.7);

  /* Spacing & Layout */
  --nav-height: 76px;
  --container-max: 1280px;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;

  /* Transitions */
  --transition-fast: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  --transition-normal: 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  --transition-slow: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

/* ==========================================================================
   Global Reset & Base
   ========================================================================== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  color-scheme: dark;
  font-size: 16px;
}

body {
  background-color: var(--bg-primary);
  color: var(--text-main);
  font-family: var(--font-sans);
  line-height: 1.6;
  overflow-x: hidden;
  position: relative;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Futuristic background pattern */
body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-image: 
    radial-gradient(circle at 15% 20%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
    radial-gradient(circle at 85% 75%, rgba(157, 0, 255, 0.09) 0%, transparent 45%),
    radial-gradient(circle at 50% 50%, rgba(255, 0, 127, 0.05) 0%, transparent 50%),
    linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 100% 100%, 48px 48px, 48px 48px;
  pointer-events: none;
  z-index: -1;
}

/* Custom Cyber Scrollbar */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: var(--bg-primary);
}

::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, var(--neon-cyan), var(--neon-purple));
  border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
  background: linear-gradient(180deg, var(--neon-cyan), var(--neon-magenta));
}

/* Links & Typography helpers */
a {
  color: inherit;
  text-decoration: none;
  transition: color var(--transition-fast);
}

h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-display);
  font-weight: 700;
  letter-spacing: -0.02em;
  color: #ffffff;
  line-height: 1.2;
}

img, video {
  max-width: 100%;
  height: auto;
  display: block;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
}

/* ==========================================================================
   Utility Classes & Design Primitives
   ========================================================================== */
.container {
  width: 100%;
  max-width: var(--container-max);
  margin: 0 auto;
  padding: 0 24px;
}

.text-gradient {
  background: var(--grad-primary);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  display: inline-block;
}

.text-gradient-warm {
  background: var(--grad-warm);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  display: inline-block;
}

.text-cyan { color: var(--neon-cyan); }
.text-magenta { color: var(--neon-magenta); }
.text-purple { color: var(--neon-purple); }

.glass-panel {
  background: var(--bg-glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  transition: all var(--transition-normal);
}

.glass-panel:hover {
  border-color: var(--border-active);
  box-shadow: 0 12px 35px -5px rgba(0, 240, 255, 0.15);
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 9999px;
  font-size: 0.75rem;
  font-weight: 600;
  font-family: var(--font-mono);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  background: rgba(0, 240, 255, 0.1);
  color: var(--neon-cyan);
  border: 1px solid rgba(0, 240, 255, 0.3);
}

.badge-magenta {
  background: rgba(255, 0, 127, 0.1);
  color: var(--neon-magenta);
  border-color: rgba(255, 0, 127, 0.3);
}

.badge-purple {
  background: rgba(157, 0, 255, 0.1);
  color: #c084fc;
  border-color: rgba(157, 0, 255, 0.3);
}

.badge-orange {
  background: rgba(255, 85, 0, 0.1);
  color: #fb923c;
  border-color: rgba(255, 85, 0, 0.3);
}

.badge-green {
  background: rgba(0, 255, 136, 0.1);
  color: #4ade80;
  border-color: rgba(0, 255, 136, 0.3);
}

/* Interactive Buttons */
.btn-cyber-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px 28px;
  border-radius: var(--radius-md);
  font-weight: 600;
  font-size: 0.95rem;
  color: #040711;
  background: var(--grad-primary);
  box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
  transition: all var(--transition-fast);
  position: relative;
  overflow: hidden;
}

.btn-cyber-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 30px rgba(255, 0, 127, 0.6);
}

.btn-cyber-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px 28px;
  border-radius: var(--radius-md);
  font-weight: 600;
  font-size: 0.95rem;
  color: var(--text-main);
  background: rgba(14, 21, 46, 0.8);
  border: 1px solid var(--border-subtle);
  backdrop-filter: blur(12px);
  transition: all var(--transition-fast);
}

.btn-cyber-secondary:hover {
  border-color: var(--neon-cyan);
  background: rgba(20, 31, 68, 0.9);
  color: var(--neon-cyan);
  box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
  transform: translateY(-2px);
}

.btn-cyber-print {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 18px;
  border-radius: var(--radius-sm);
  font-size: 0.82rem;
  font-weight: 600;
  font-family: var(--font-mono);
  color: var(--neon-cyan);
  background: rgba(0, 240, 255, 0.08);
  border: 1px solid rgba(0, 240, 255, 0.4);
  transition: all var(--transition-fast);
}

.btn-cyber-print:hover {
  background: var(--neon-cyan);
  color: #040711;
  box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
}

/* ==========================================================================
   Header & Navigation
   ========================================================================== */
.navbar-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: var(--nav-height);
  z-index: 1000;
  transition: all var(--transition-normal);
  background: rgba(4, 7, 17, 0.7);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(0, 240, 255, 0.08);
}

.navbar-header.scrolled {
  background: rgba(4, 7, 17, 0.94);
  border-bottom: 1px solid rgba(0, 240, 255, 0.2);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
}

.nav-inner {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.brand-icon-hex {
  position: relative;
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--neon-cyan);
}

.hex-svg {
  position: absolute;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 0 8px var(--neon-cyan-glow));
}

.brand-letter {
  position: relative;
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 1.25rem;
  color: #ffffff;
}

.brand-text {
  display: flex;
  flex-direction: column;
}

.brand-main {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.05rem;
  letter-spacing: -0.01em;
  color: #ffffff;
}

.brand-sub {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  color: var(--neon-cyan);
  letter-spacing: 0.08em;
}

.nav-links-desktop {
  display: flex;
  align-items: center;
  gap: 24px;
}

.nav-link-btn {
  font-size: 0.88rem;
  font-weight: 500;
  color: var(--text-secondary);
  transition: all var(--transition-fast);
  padding: 6px 0;
  position: relative;
}

.nav-link-btn:hover {
  color: var(--neon-cyan);
}

.nav-link-btn.active {
  color: #ffffff;
  font-weight: 600;
}

.nav-link-indicator {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--grad-primary);
  border-radius: 2px;
  box-shadow: 0 0 8px var(--neon-cyan);
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* ==========================================================================
   Hero Section
   ========================================================================== */
.hero-section {
  position: relative;
  min-height: 100vh;
  padding-top: calc(var(--nav-height) + 40px);
  padding-bottom: 80px;
  display: flex;
  align-items: center;
  overflow: hidden;
}

.hero-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

.hero-container {
  position: relative;
  z-index: 1;
  text-align: center;
  max-width: 900px;
}

.hero-badge-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 24px;
}

.live-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--neon-green);
  box-shadow: 0 0 8px var(--neon-green);
  animation: pulse-dot 1.8s infinite;
}

@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.85); }
}

.hero-title {
  font-size: clamp(2.5rem, 5.5vw, 4.2rem);
  font-weight: 900;
  line-height: 1.1;
  margin-bottom: 24px;
  letter-spacing: -0.03em;
}

.hero-typewriter-box {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  padding: 8px 24px;
  background: rgba(14, 21, 46, 0.85);
  border: 1px solid var(--border-subtle);
  border-radius: 9999px;
  margin-bottom: 24px;
  backdrop-filter: blur(10px);
}

.typewriter-prefix {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  color: var(--neon-cyan);
  margin-right: 8px;
}

.typewriter-text {
  font-family: var(--font-mono);
  font-size: 0.95rem;
  font-weight: 600;
  color: #ffffff;
}

.typewriter-cursor {
  display: inline-block;
  width: 8px;
  height: 16px;
  background: var(--neon-magenta);
  margin-left: 6px;
  animation: blink 0.8s infinite;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

.hero-desc {
  font-size: clamp(1rem, 2vw, 1.18rem);
  color: var(--text-secondary);
  line-height: 1.7;
  margin-bottom: 36px;
  max-width: 780px;
  margin-left: auto;
  margin-right: auto;
}

.hero-cta-group {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  margin-bottom: 56px;
  flex-wrap: wrap;
}

.hero-stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  padding: 24px 32px;
  gap: 16px;
  background: rgba(8, 13, 30, 0.75);
  border: 1px solid rgba(0, 240, 255, 0.2);
}

.stat-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.stat-number {
  font-family: var(--font-display);
  font-size: 2.2rem;
  font-weight: 800;
  line-height: 1;
}

.stat-label {
  font-size: 0.8rem;
  color: var(--text-muted);
  font-weight: 500;
}

.stat-divider {
  width: 1px;
  background: rgba(255, 255, 255, 0.08);
}

/* ==========================================================================
   Section Headers
   ========================================================================== */
section {
  padding: 100px 0;
  position: relative;
}

.section-header {
  text-align: center;
  max-width: 760px;
  margin: 0 auto 56px auto;
}

.section-subtitle {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--neon-cyan);
  letter-spacing: 2px;
  margin-bottom: 12px;
  display: block;
}

.section-title {
  font-size: clamp(2rem, 3.5vw, 2.8rem);
  margin-bottom: 16px;
}

.section-desc {
  font-size: 1.05rem;
  color: var(--text-secondary);
  line-height: 1.6;
}

/* ==========================================================================
   Lines of Development (Hex/Pill Badges)
   ========================================================================== */
.dev-lines-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
  gap: 24px;
  margin-bottom: 60px;
}

.line-card {
  padding: 28px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  position: relative;
  overflow: hidden;
}

.line-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 4px;
  height: 100%;
  background: var(--grad-primary);
}

.line-card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.line-name {
  font-size: 1.25rem;
  margin-bottom: 4px;
}

.line-sub {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--neon-cyan);
}

.line-count-pill {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  padding: 4px 10px;
  background: rgba(0, 240, 255, 0.1);
  border: 1px solid rgba(0, 240, 255, 0.3);
  border-radius: 9999px;
  color: var(--neon-cyan);
  white-space: nowrap;
}

.line-desc {
  font-size: 0.92rem;
  color: var(--text-secondary);
  line-height: 1.6;
}

.line-tech-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: auto;
}

.tech-tag-sm {
  font-size: 0.72rem;
  font-family: var(--font-mono);
  padding: 3px 8px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 4px;
  color: #cbd5e1;
}

/* ==========================================================================
   Project Grid & Cards
   ========================================================================== */
.filter-controls-wrap {
  margin-bottom: 40px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.filter-tabs-scroll {
  overflow-x: auto;
  padding-bottom: 8px;
}

.filter-tabs {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: max-content;
}

.filter-btn {
  padding: 10px 20px;
  border-radius: 9999px;
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: rgba(14, 21, 46, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.08);
  transition: all var(--transition-fast);
  cursor: pointer;
}

.filter-btn:hover {
  border-color: var(--neon-cyan);
  color: #ffffff;
}

.filter-btn.active {
  background: rgba(0, 240, 255, 0.15);
  border-color: var(--neon-cyan);
  color: var(--neon-cyan);
  box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
  font-weight: 600;
}

.filter-search-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.search-input-box {
  flex: 1;
  min-width: 260px;
  position: relative;
}

.search-input {
  width: 100%;
  padding: 12px 20px;
  background: rgba(8, 13, 30, 0.8);
  border: 1px solid rgba(0, 240, 255, 0.2);
  border-radius: var(--radius-md);
  color: #ffffff;
  font-family: inherit;
  font-size: 0.9rem;
  outline: none;
  transition: all var(--transition-fast);
}

.search-input:focus {
  border-color: var(--neon-cyan);
  box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
}

.projects-counter-badge {
  font-family: var(--font-mono);
  font-size: 0.82rem;
  color: var(--text-muted);
}

.projects-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 32px;
}

.project-card {
  position: relative;
  display: flex;
  flex-direction: column;
  border-radius: var(--radius-lg);
  overflow: hidden;
  cursor: pointer;
  height: 100%;
}

.card-media-wrapper {
  position: relative;
  width: 100%;
  height: 220px;
  background: #060a17;
  overflow: hidden;
}

.card-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform var(--transition-normal);
}

.project-card:hover .card-img {
  transform: scale(1.05);
}

.media-overlay-top {
  position: absolute;
  top: 14px;
  left: 14px;
  right: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 2;
  pointer-events: none;
}

.live-demo-tag {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 9999px;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(8px);
  border: 1px solid var(--neon-cyan);
  color: var(--neon-cyan);
  font-size: 0.7rem;
  font-family: var(--font-mono);
  font-weight: 700;
}

.slide-tag-badge {
  position: absolute;
  bottom: 12px;
  right: 14px;
  padding: 2px 8px;
  border-radius: 4px;
  background: rgba(0, 0, 0, 0.8);
  color: #94a3b8;
  font-family: var(--font-mono);
  font-size: 0.68rem;
  z-index: 2;
}

.card-content {
  padding: 24px;
  display: flex;
  flex-direction: column;
  flex: 1;

      // HERO
      const TYPEWRITER_PHRASES = [
        'Realidades Extendidas (VR / AR / MR / WebXR)',
        'Inteligencia Artificial & Modelos AA',
        'Gemelos Digitales & Fotogrametría 3D',
        'Aeronáutica & Drones No Tripulados',

      ];

      function Hero(props) {
        const [phraseIdx, setPhraseIdx] = useState(0);
        const [text, setText] = useState('');
        const [isDeleting, setIsDeleting] = useState(false);
        const canvasRef = useRef(null);

        useEffect(function() {
          const currentPhrase = TYPEWRITER_PHRASES[phraseIdx];
          const speed = isDeleting ? 35 : 75;
          const timer = setTimeout(function() {
            if (!isDeleting) {
              setText(currentPhrase.substring(0, text.length + 1));
              if (text === currentPhrase) {
                setTimeout(function() { setIsDeleting(true); }, 2200);
              }
            } else {
              setText(currentPhrase.substring(0, text.length - 1));
              if (text === '') {
                setIsDeleting(false);
                setPhraseIdx(function(prev) { return (prev + 1) % TYPEWRITER_PHRASES.length; });
              }
            }
          }, speed);
          return function() { clearTimeout(timer); };
        }, [text, isDeleting, phraseIdx]);

        useEffect(function() {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          let animId;
          let w = (canvas.width = canvas.parentElement.offsetWidth || window.innerWidth);
          let h = (canvas.height = canvas.parentElement.offsetHeight || 600);

          const particles = [];
          const count = Math.min(45, Math.floor(w / 28));
          for (let i = 0; i < count; i++) {
            particles.push({
              x: Math.random() * w,
              y: Math.random() * h,
              vx: (Math.random() - 0.5) * 0.7,
              vy: (Math.random() - 0.5) * 0.7,
              r: Math.random() * 2 + 1,
              color: Math.random() > 0.5 ? '#00f0ff' : '#9d00ff'
            });
          }

          function render() {
            ctx.clearRect(0, 0, w, h);
            for (let i = 0; i < particles.length; i++) {
              const p = particles[i];
              p.x += p.vx; p.y += p.vy;
              if (p.x < 0 || p.x > w) p.vx *= -1;
              if (p.y < 0 || p.y > h) p.vy *= -1;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
              ctx.fillStyle = p.color;
              ctx.fill();

              for (let j = i + 1; j < particles.length; j++) {
                const p2 = particles[j];
                const d = Math.hypot(p.x - p2.x, p.y - p2.y);
                if (d < 110) {
                  ctx.beginPath();
                  ctx.moveTo(p.x, p.y);
                  ctx.lineTo(p2.x, p2.y);
                  ctx.strokeStyle = 'rgba(0, 240, 255, ' + (0.12 * (1 - d / 110)) + ')';
                  ctx.stroke();
                }
              }
            }
            animId = requestAnimationFrame(render);
          }
          render();
          return function() { cancelAnimationFrame(animId); };
        }, []);

        function scrollTo(id) {
          const el = document.getElementById(id);
          if (el) el.scrollIntoView({ behavior: 'smooth' });
        }

        return e('section', { id: 'hero', className: 'hero-section' },
          e('canvas', { ref: canvasRef, className: 'hero-canvas' }),
          e('div', { className: 'container hero-container' },
            e('div', { className: 'hero-badge-wrap' },
              e('div', { className: 'badge' },
                e('span', { className: 'live-dot' }),
                e('span', null, 'INDUSTRIA 4.0 & 5.0 • I+D+i UCEVA')
              )
            ),
            e('h1', { className: 'hero-title' },
              'Centro de Prototipado',
              e('br'),
              e('span', { className: 'text-gradient' }, '& STEAM UCEVA')
            ),
            e('div', { className: 'hero-typewriter-box' },
              e('span', { className: 'typewriter-prefix' }, '> Especialidad: '),
              e('span', { className: 'typewriter-text' }, text),
              e('span', { className: 'typewriter-cursor' })
            ),
            e('p', { className: 'hero-desc' },
              'Ecosistema universitario de investigación aplicada, fabricación digital y tecnologías inmersivas de la ',
              e('strong', null, 'Unidad Central del Valle del Cauca'),

            e('div', { className: 'hero-cta-group' },

              e('p', { className: 'section-desc' }, 'Surgido en el año 2023 como respuesta a las necesidades tecnológicas de la comunidad docente, estudiantil e investigadores.')
            ),
            e('div', { className: 'glass-panel', style: { padding: '36px 40px' } },
              e('span', { className: 'badge badge-purple', style: { marginBottom: '16px' } }, 'Trayectoria 2023 – Presente'),
              e('h3', { style: { fontSize: '1.6rem', marginBottom: '16px', color: '#fff' } },
                'Capacidades en Desarrollo Físico, Tecnológico y Científico'
              ),
              e('p', { style: { color: 'var(--text-secondary)', fontSize: '1.05rem', lineHeight: '1.8', marginBottom: '20px' } },
                info.description
              ),
              e('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '10px' } },
                domains.map(function(d, i) {
                  return e('span', { key: i, className: 'badge', style: { textTransform: 'none', fontSize: '0.85rem' } },
                    '⚡ ' + d
                  );
                })
              )
            )
          )
        );
      }

      // DEVELOPMENT LINES
      function DevelopmentLines(props) {
        const lines = props.lines || [];

        return e('section', { id: 'lines', className: 'lines-section' },
          e('div', { className: 'container' },
            e('div', { className: 'section-header' },
              e('span', { className: 'section-subtitle' }, '< EJES ESTRATÉGICOS / >'),
              e('h2', { className: 'section-title' }, 'Líneas de ', e('span', { className: 'text-gradient' }, 'Desarrollo Tecnológico')),
              e('p', { className: 'section-desc' }, 'Áreas temáticas que articulan la investigación aplicada y la creación de prototipos funcionales.')
            ),
            e('div', { className: 'dev-lines-grid' },
              lines.map(function(line) {
                return e('div', { key: line.id, className: 'line-card glass-panel' },
                  e('div', { className: 'line-card-header' },
                    e('div', null,
                      e('h3', { className: 'line-name' }, line.name),
                      e('span', { className: 'line-sub' }, line.subtitle)
                    ),
                    e('span', { className: 'line-count-pill' }, line.count + ' Proyectos')
                  ),
                  e('p', { className: 'line-desc' }, line.desc),
                  e('div', { className: 'line-tech-wrap' },
                    (line.techs || []).map(function(t, idx) {
                      return e('span', { key: idx, className: 'tech-tag-sm' }, t);
                    })
                  )
                );
              })
            )
          )
        );
      }

      // PROJECT CARD
      function ProjectCard(props) {
        const p = props.project;
        const [hovered, setHovered] = useState(false);

        const imgSrc = (p.gif && hovered) ? p.gif : (p.previewImage || (p.gallery && p.gallery[0]) || 'assets/projects/slide_render_1.jpg');

        return e('div', {
          className: 'project-card glass-panel',
          onMouseEnter: function() { setHovered(true); },
          onMouseLeave: function() { setHovered(false); },
          onClick: function() { props.onSelect(p); }
        },
          e('div', { className: 'card-media-wrapper' },
            e('img', {
              src: imgSrc,
              alt: p.title,
              className: 'card-img',
              onError: function(ev) { ev.target.src = 'assets/projects/slide_render_1.jpg'; }
            }),
            e('div', { className: 'media-overlay-top' },
              e('span', { className: 'badge' }, p.category),
              p.gif ? e('span', { className: 'live-demo-tag' }, 'DEMO VIVO') : null
            ),
            e('div', { className: 'slide-tag-badge' }, 'Slide ' + p.slide)
          ),
          e('div', { className: 'card-content' },
            e('span', { className: 'project-tag-pill' }, p.tag),
            e('h3', { className: 'card-title' }, p.title),
            e('p', { className: 'card-desc' }, p.shortDesc),
            e('div', { className: 'card-tech-stack' },
              (p.techStack || []).slice(0, 3).map(function(t, idx) {
                return e('span', { key: idx, className: 'tech-badge' }, t);
              })
            ),
            e('div', { className: 'card-footer-action' },
              e('span', null, 'Ver Detalles & Multimedia'),
              e('span', { className: 'action-icon' }, '→')
            )
          )
        );
      }

      // PROJECT GRID
      function Projects(props) {
        const [cat, setCat] = useState('ALL');
        const [search, setSearch] = useState('');

        const categories = [
          { id: 'ALL', label: 'Todos' },
          { id: 'VR', label: 'VR & Inmersión' },
          { id: 'MR', label: 'Realidad Mixta (MR)' },
          { id: 'AR', label: 'Realidad Aumentada (AR)' },
          { id: 'IA', label: 'Inteligencia Artificial' },
          { id: '3D', label: 'Fotogrametría & 3D' },
          { id: 'AERO', label: 'Aeronáutica & Drones' },
          { id: 'FAB', label: 'Fabricación Digital' },
          { id: 'IOT', label: 'Electrónica & IoT' }
        ];

        const filtered = useMemo(function() {
          return (props.projects || []).filter(function(item) {
            let matchCat = true;
            if (cat !== 'ALL') {
              if (cat === 'VR') matchCat = item.category.includes('VR');
              else if (cat === 'MR') matchCat = item.category.includes('MR');
              else if (cat === 'AR') matchCat = item.category.includes('AR');
              else if (cat === 'IA') matchCat = item.category.includes('IA') || item.category.includes('Inteligencia');
              else if (cat === '3D') matchCat = item.category.includes('Fotogrametría') || item.category.includes('3D');
              else if (cat === 'AERO') matchCat = item.category.includes('Aeronáutica') || item.category.includes('Robótica');
              else if (cat === 'FAB') matchCat = item.category.includes('Fabricación');
              else if (cat === 'IOT') matchCat = item.category.includes('IoT') || item.category.includes('Electrónica');
            }
            let matchSearch = true;
            if (search.trim() !== '') {
              const q = search.toLowerCase();
              matchSearch = item.title.toLowerCase().includes(q) ||
                            item.fullDesc.toLowerCase().includes(q) ||
                            (item.techStack || []).some(function(t) { return t.toLowerCase().includes(q); });
            }
            return matchCat && matchSearch;
          });
        }, [props.projects, cat, search]);

        return e('section', { id: 'projects', className: 'projects-section' },
          e('div', { className: 'container' },
            e('div', { className: 'section-header' },
              e('span', { className: 'section-subtitle' }, '< PORTAFOLIO DE I+D+i / >'),
              e('h2', { className: 'section-title' }, 'Desarrollos & ', e('span', { className: 'text-gradient' }, 'Proyectos Tecnológicos')),
              e('p', { className: 'section-desc' }, 'Soluciones inmersivas, gemelos digitales, hardware de precisión y sistemas de IA de la UCEVA.')
            ),
            e('div', { className: 'filter-controls-wrap no-print' },
              e('div', { className: 'filter-tabs-scroll' },
                e('div', { className: 'filter-tabs' },
                  categories.map(function(c) {
                    return e('button', {
                      key: c.id,
                      onClick: function() { setCat(c.id); },
                      className: 'filter-btn ' + (cat === c.id ? 'active' : '')
                    }, c.label);
                  })
                )
              ),
              e('div', { className: 'filter-search-row' },
                e('div', { className: 'search-input-box' },
                  e('input', {
                    type: 'text',
                    placeholder: 'Buscar por tecnología, título o palabra clave...',
                    value: search,
                    onChange: function(ev) { setSearch(ev.target.value); },
                    className: 'search-input'
                  })
                ),
                e('div', { className: 'projects-counter-badge' },
                  'Mostrando: ', e('strong', null, filtered.length), ' proyectos'
                )
              )
            ),
            e('div', { className: 'projects-grid' },
              filtered.map(function(p) {
                return e(ProjectCard, { key: p.id, project: p, onSelect: props.onSelectProject });
              })
            )
          )
        );
      }

      // MODAL LIGHTBOX
      function ProjectModal(props) {
        const p = props.project;
        const [idx, setIdx] = useState(0);

        useEffect(function() {
          function onKey(ev) { if (ev.key === 'Escape') props.onClose(); }
          window.addEventListener('keydown', onKey);
          return function() { window.removeEventListener('keydown', onKey); };
        }, [props.onClose]);

        if (!p) return null;

        const media = [];
        if (p.gif) media.push({ type: 'gif', src: p.gif, label: 'Demo Animado' });
        if (p.gallery && p.gallery.length) {
          p.gallery.forEach(function(img, i) {
            media.push({ type: 'img', src: img, label: 'Captura ' + (i + 1) });
          });
        }
        if (!media.length && p.previewImage) {
          media.push({ type: 'img', src: p.previewImage, label: 'Vista previa' });
        }

        const current = media[idx] || media[0] || { src: 'assets/projects/slide_render_1.jpg' };

        return e('div', { className: 'modal-overlay', onClick: props.onClose },
          e('div', { className: 'modal-content glass-panel modal-enter', onClick: function(ev) { ev.stopPropagation(); } },
            e('div', { className: 'modal-header' },
              e('div', { className: 'modal-header-meta' },
                e('span', { className: 'badge' }, p.category),
                e('span', { className: 'badge badge-purple' }, p.tag),
                e('span', { className: 'slide-num-pill' }, 'Diapositiva ' + p.slide)
              ),
              e('button', { className: 'modal-close-btn', onClick: props.onClose }, '✕')
            ),
            e('h2', { className: 'modal-title' }, p.title),
            e('div', { className: 'modal-body-grid' },
              e('div', { className: 'modal-media-col' },
                e('div', { className: 'modal-media-main-box' },
                  e('img', {
                    src: current.src,
                    alt: p.title,
                    className: 'modal-display-media',
                    onError: function(ev) { ev.target.src = 'assets/projects/slide_render_1.jpg'; }
                  })
                ),
                media.length > 1 ? e('div', { className: 'modal-thumbs-row' },
                  media.map(function(m, i) {
                    return e('button', {
                      key: i,
                      onClick: function() { setIdx(i); },
                      className: 'thumb-btn ' + (idx === i ? 'active' : '')
                    },
                      e('img', { src: m.src, alt: '', className: 'thumb-img' })
                    );
                  })
                ) : null
              ),
              e('div', { className: 'modal-details-col' },
                e('div', { className: 'detail-section' },
                  e('h4', { className: 'detail-subtitle' }, 'Descripción Técnica'),
                  e('p', { className: 'detail-text' }, p.fullDesc)
                ),
                e('div', { className: 'detail-section' },
                  e('h4', { className: 'detail-subtitle' }, 'Rol Desempeñado'),
                  e('p', { className: 'detail-text' }, '⚡ ' + p.role)
                ),
                e('div', { className: 'detail-section' },
                  e('h4', { className: 'detail-subtitle' }, 'Stack de Tecnologías'),
                  e('div', { className: 'modal-tech-pills' },
                    (p.techStack || []).map(function(t, i) {
                      return e('span', { key: i, className: 'tech-pill-modal' }, t);
                    })
                  )
                )
              )
            )
          )
        );
      }

      // CAPABILITIES / EQUIPMENT
      function Capabilities(props) {
        const eqList = props.equipment || [];

        return e('section', { id: 'capabilities', className: 'capabilities-section', style: { background: 'var(--bg-secondary)' } },
          e('div', { className: 'container' },
            e('div', { className: 'section-header' },
              e('span', { className: 'section-subtitle' }, '< INFRAESTRUCTURA TÉCNICA / >'),
              e('h2', { className: 'section-title' }, 'Equipamiento ', e('span', { className: 'text-gradient' }, 'Tecnológico & Educativo')),
              e('p', { className: 'section-desc' }, 'Herramientas de última generación para diseño, simulación, manufactura aditiva y despliegue.')
            ),
            e('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '24px' } },
              eqList.map(function(eq, i) {
                return e('div', { key: i, className: 'glass-panel', style: { padding: '28px' } },
                  e('h3', { style: { color: 'var(--neon-cyan)', fontSize: '1.2rem', marginBottom: '16px' } }, eq.category),
                  e('ul', { style: { listStyle: 'none', display: 'flex', flexDirection: 'column', gap: '10px', color: 'var(--text-secondary)', fontSize: '0.92rem' } },
                    (eq.items || []).map(function(item, idx) {
                      return e('li', { key: idx }, '✓ ' + item);
                    })
                  )
                );
              })
            )
          )
        );
      }

      // TEAM SECTION
      function Team(props) {
        const teamData = props.team || {};
        const professionals = teamData.professionals || [];
        const support = teamData.support || [];
        const [activeTab, setActiveTab] = useState('ALL');

        return e('section', { id: 'team', className: 'team-section' },
          e('div', { className: 'container' },
            e('div', { className: 'section-header' },
              e('span', { className: 'section-subtitle' }, '< TALENTO HUMANO / >'),
              e('h2', { className: 'section-title' }, 'Equipo de ', e('span', { className: 'text-gradient' }, 'Investigadores & Apoyo')),
              e('p', { className: 'section-desc' }, 'Equipo interdisciplinario de la UCEVA preparado para responder a las necesidades de la Industria 4.0 y 5.0.')
            ),

            e('div', { className: 'filter-controls-wrap no-print', style: { alignItems: 'center', marginBottom: '32px' } },
              e('div', { className: 'filter-tabs' },
                e('button', {
                  onClick: function() { setActiveTab('ALL'); },
                  className: 'filter-btn ' + (activeTab === 'ALL' ? 'active' : '')
                }, 'Todo el Equipo (18)'),
                e('button', {
                  onClick: function() { setActiveTab('PRO'); },
                  className: 'filter-btn ' + (activeTab === 'PRO' ? 'active' : '')
                }, 'Investigadores Profesionales (6)'),
                e('button', {
                  onClick: function() { setActiveTab('SUPPORT'); },
                  className: 'filter-btn ' + (activeTab === 'SUPPORT' ? 'active' : '')
                }, 'Equipo de Apoyo & Semilleros (12)')
              )
            ),

            (activeTab === 'ALL' || activeTab === 'PRO') ? e('div', { style: { marginBottom: '48px' } },
              e('div', { style: { display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '24px' } },
                e('span', { className: 'badge badge-cyan' }, 'Slide 3 — Presentación'),
                e('h3', { style: { fontSize: '1.35rem', color: '#ffffff' } }, 'Equipo de Profesionales & Líderes I+D')
              ),
              e('div', { className: 'team-grid' },
                professionals.map(function(prof, i) {
                  const initials = prof.name.split(' ').map(function(n) { return n[0]; }).slice(0, 2).join('');
                  return e('div', { key: i, className: 'team-card glass-panel' },
                    e('div', { className: 'member-avatar-box' },
                      e('img', {
                        src: prof.avatar,
                        alt: prof.name,
                        className: 'member-avatar-img',
                        onError: function(ev) { ev.target.style.display = 'none'; }
                      }),
                      e('div', { className: 'avatar-fallback' }, initials)
                    ),
                    e('span', { className: 'member-role-tag' }, prof.role),
                    e('h3', { className: 'member-name' }, prof.name),
                    (prof.degrees && prof.degrees.length) ? e('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '4px', justifyContent: 'center', marginBottom: '8px' } },
                      prof.degrees.map(function(deg, dIdx) {
                        return e('span', { key: dIdx, className: 'tech-tag-sm', style: { fontSize: '0.7rem' } }, deg);
                      })
                    ) : null,
                    e('p', { className: 'member-focus' }, prof.focus)
                  );
                })
              )
            ) : null,

            (activeTab === 'ALL' || activeTab === 'SUPPORT') ? e('div', null,
              e('div', { style: { display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '24px' } },
                e('span', { className: 'badge badge-purple' }, 'Slides 4 y 5 — Presentación'),
                e('h3', { style: { fontSize: '1.35rem', color: '#ffffff' } }, 'Equipo de Apoyo, Monitores & Practicantes')
              ),
              e('div', { className: 'team-grid' },
                support.map(function(sup, i) {
                  const initials = sup.name.split(' ').map(function(n) { return n[0]; }).slice(0, 2).join('');
                  return e('div', { key: i, className: 'team-card glass-panel' },
                    e('div', { className: 'member-avatar-box', style: { borderColor: 'var(--neon-magenta)' } },
                      e('img', {
                        src: sup.avatar,
                        alt: sup.name,
                        className: 'member-avatar-img',
                        onError: function(ev) { ev.target.style.display = 'none'; }
                      }),
                      e('div', { className: 'avatar-fallback' }, initials)
                    ),
                    e('span', { className: 'member-role-tag' }, sup.role),
                    e('h3', { className: 'member-name' }, sup.name),
                    e('span', { className: 'tech-tag-sm', style: { marginBottom: '8px', fontSize: '0.72rem' } }, sup.degree),
                    e('p', { className: 'member-focus' }, sup.focus)
                  );
                })
              )
            ) : null
          )
        );
      }

      // CONTACT & FOOTER
      function Contact(props) {
        return e('section', { id: 'contact', className: 'contact-section', style: { background: 'var(--bg-secondary)', paddingBottom: '80px' } },
          e('div', { className: 'container' },
            e('div', { className: 'section-header' },
              e('span', { className: 'section-subtitle' }, '< CONEXIÓN & TRANSFERENCIA / >'),
              e('h2', { className: 'section-title' }, 'Contacto & ', e('span', { className: 'text-gradient' }, 'Alianzas I+D')),
              e('p', { className: 'section-desc' }, 'Vinculación tecnológica con la academia, la industria y el sector público.')
            ),
            e('div', { className: 'glass-panel', style: { padding: '40px', maxWidth: '780px', margin: '0 auto', textAlign: 'center' } },
              e('h3', { style: { fontSize: '1.6rem', marginBottom: '14px', color: '#fff' } }, 'Centro de Prototipado & STEAM UCEVA'),
              e('p', { style: { color: 'var(--text-secondary)', marginBottom: '24px', lineHeight: '1.8' } },
                'Campus Universitario UCEVA — Cra. 27 A # 48-144, Tuluá, Valle del Cauca, Colombia', e('br'),
                'Correo institucional: ', e('strong', { style: { color: 'var(--neon-cyan)' } }, 'centrosteam@uceva.edu.co')
              ),
              e('button', { onClick: props.onPrintPdf, className: 'btn-cyber-primary' },
                e('span', null, '📄 Descargar Dossier PDF Oficial')
              )
            )
          )
        );
      }

      function Footer() {
        return e('footer', { style: { padding: '36px 0', borderTop: '1px solid rgba(255,255,255,0.08)', background: '#02040a', textAlign: 'center' } },
          e('div', { className: 'container' },
            e('p', { style: { color: '#64748b', fontSize: '0.85rem' } },
              '© ' + new Date().getFullYear() + ' Unidad Central del Valle del Cauca (UCEVA) — Centro de Prototipado & STEAM. Todos los derechos reservados.'
            )
          )
        );
      }

      // APP ROOT
      function App() {
        const [activeProject, setActiveProject] = useState(null);

        function handlePrint() {
          window.print();
        }

        return e('div', { className: 'portfolio-app' },
          e(Navbar, { onPrintPdf: handlePrint }),
          e('main', null,
            e(Hero, { onPrintPdf: handlePrint }),
            e(About, { centerInfo: DATA.centerInfo }),
            e(DevelopmentLines, { lines: DATA.developmentLines }),
            e(Projects, { projects: DATA.projects, onSelectProject: function(p) { setActiveProject(p); } }),
            e(Capabilities, { equipment: DATA.equipment }),
            e(Team, { team: DATA.team }),
            e(Contact, { onPrintPdf: handlePrint })
          ),
          e(Footer),
          activeProject ? e(ProjectModal, { project: activeProject, onClose: function() { setActiveProject(null); } }) : null
        );
      }

      // MOUNT APPLICATION
      ReactDOM.createRoot(document.getElementById('root')).render(e(App));
    })();
  </script>
</body>
</html>
