<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Centro de Prototipado & STEAM UCEVA | Portafolio</title>
  <meta name="description" content="Portafolio tecnológico del Centro de Prototipado y STEAM de la Unidad Central del Valle del Cauca (UCEVA).">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-primary: #040711;
      --bg-secondary: #080d1e;
      --bg-card: rgba(14, 21, 46, 0.75);
      --bg-card-hover: rgba(22, 34, 72, 0.9);
      --bg-glass: rgba(10, 16, 35, 0.75);
      
      --neon-cyan: #00f0ff;
      --neon-purple: #9d00ff;
      --neon-magenta: #ff007f;
      --neon-orange: #ff5500;
      
      --grad-primary: linear-gradient(135deg, #00f0ff 0%, #9d00ff 50%, #ff007f 100%);
      --grad-warm: linear-gradient(135deg, #ff007f 0%, #ff5500 100%);
      
      --text-main: #f0f4fc;
      --text-secondary: #a2b4d6;
      --text-muted: #64748b;
      
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-display: 'Outfit', var(--font-sans);
      --font-mono: 'JetBrains Mono', monospace;
      
      --border-subtle: rgba(0, 240, 255, 0.15);
      --border-active: rgba(0, 240, 255, 0.5);
      --shadow-glow: 0 0 25px rgba(0, 240, 255, 0.2);
      
      --container-max: 1240px;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
      overflow-x: hidden;
      width: 100%;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.6;
      overflow-x: hidden;
      width: 100%;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Container */
    .container {
      width: 100%;
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 0 20px;
    }

    @media (max-width: 640px) {
      .container {
        padding: 0 16px;
      }
    }

    /* Typography */
    h1, h2, h3, h4 {
      font-family: var(--font-display);
      font-weight: 700;
      line-height: 1.25;
      color: #ffffff;
    }

    .text-gradient {
      background: var(--grad-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }

    /* Navbar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(4, 7, 17, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 68px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--grad-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-weight: 800;
      font-size: 0.95rem;
      color: #040711;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-size: 1rem;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .brand-text span {
      font-size: 0.7rem;
      color: var(--neon-cyan);
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
    }

    /* Desktop Navigation Links */
    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--neon-cyan);
    }

    /* Mobile Hamburger Menu */
    .mobile-menu-btn {
      display: none;
      background: rgba(14, 21, 46, 0.8);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--neon-cyan);
      font-size: 1.3rem;
      cursor: pointer;
      line-height: 1;
    }

    .mobile-nav-drawer {
      display: none;
      position: fixed;
      top: 68px;
      left: 0;
      width: 100%;
      background: rgba(4, 7, 17, 0.98);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 16px 20px 24px;
      flex-direction: column;
      gap: 10px;
      z-index: 99;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.7);
    }

    .mobile-nav-drawer.open {
      display: flex;
    }

    .mobile-nav-drawer a {
      color: var(--text-main);
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      padding: 12px 16px;
      border-radius: 8px;
      background: rgba(14, 21, 46, 0.6);
      border: 1px solid var(--border-subtle);
    }

    .mobile-nav-drawer a:hover {
      color: var(--neon-cyan);
      border-color: var(--neon-cyan);
    }

    @media (max-width: 860px) {
      .nav-links {
        display: none;
      }
      .mobile-menu-btn {
        display: block;
      }
    }

    /* Section Styles */
    section {
      padding: 60px 0;
      position: relative;
    }

    @media (max-width: 640px) {
      section {
        padding: 40px 0;
      }
    }

    .section-header {
      margin-bottom: 32px;
      text-align: center;
    }

    .section-tag {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--neon-cyan);
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.25);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: clamp(1.5rem, 3.5vw, 2.3rem);
      margin-bottom: 8px;
    }

    /* Hero Section */
    .hero-section {
      padding: clamp(50px, 8vw, 90px) 0 40px;
      text-align: center;
      background: radial-gradient(circle at 50% 15%, rgba(157, 0, 255, 0.18), transparent 70%);
    }

    .hero-title {
      font-size: clamp(1.8rem, 5.5vw, 3.4rem);
      letter-spacing: -0.02em;
      margin-bottom: 14px;
    }

    .hero-institution {
      font-size: clamp(1rem, 2.2vw, 1.3rem);
      color: var(--text-secondary);
      margin-bottom: 24px;
      font-weight: 500;
    }

    .hero-buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.92rem;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 46px;
    }

    @media (max-width: 480px) {
      .hero-buttons .btn {
        width: 100%;
      }
    }

    .btn-primary {
      background: var(--grad-primary);
      color: #040711;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.35);
      border: none;
    }

    .btn-primary:hover {
      box-shadow: 0 0 30px rgba(255, 0, 127, 0.5);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: rgba(14, 21, 46, 0.8);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
    }

    .btn-secondary:hover {
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
    }

    /* About Section */
    .about-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: clamp(20px, 4vw, 36px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      max-width: 960px;
      margin: 0 auto;
    }

    .about-card p {
      font-size: clamp(0.95rem, 1.8vw, 1.12rem);
      line-height: 1.8;
      color: var(--text-secondary);
      text-align: justify;
    }

    /* Category Filter Tabs (Swipeable on Mobile) */
    .filter-container {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 24px;
      scrollbar-width: thin;
      scrollbar-color: var(--neon-cyan) transparent;
      -webkit-overflow-scrolling: touch;
    }

    .filter-container::-webkit-scrollbar {
      height: 4px;
    }

    .filter-container::-webkit-scrollbar-thumb {
      background: var(--neon-cyan);
      border-radius: 4px;
    }

    .filter-btn {
      white-space: nowrap;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(14, 21, 46, 0.7);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--neon-cyan);
      color: #040711;
      border-color: var(--neon-cyan);
      font-weight: 600;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
    }

    /* Responsive Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    @media (max-width: 640px) {
      .cards-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }

    /* Card Item */
    .card-item {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.25s ease;
    }

    .card-item:hover {
      border-color: var(--border-active);
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(0, 240, 255, 0.12);
    }

    .card-media-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #060a17;
      overflow: hidden;
    }

    .card-media-wrapper img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .card-item:hover .card-media-wrapper img {
      transform: scale(1.03);
    }

    .card-media-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(4, 7, 17, 0.88);
      backdrop-filter: blur(8px);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-family: var(--font-mono);
      color: var(--neon-cyan);
      border: 1px solid rgba(0, 240, 255, 0.3);
    }

    .card-body {
      padding: 16px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-category {
      font-size: 0.72rem;
      font-family: var(--font-mono);
      color: var(--neon-cyan);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .card-title {
      font-size: 1.05rem;
      color: #ffffff;
      margin-bottom: 14px;
      line-height: 1.35;
    }

    .card-action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.25);
      color: var(--neon-cyan);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 42px;
    }

    .card-action-btn:hover {
      background: var(--neon-cyan);
      color: #040711;
    }

    /* Team Grid */
    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }

    @media (max-width: 640px) {
      .team-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }

    .team-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 20px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.2s ease;
    }

    .team-card:hover {
      border-color: var(--border-active);
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 240, 255, 0.1);
    }

    .team-avatar-box {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 2px solid var(--neon-cyan);
      overflow: hidden;
      margin-bottom: 14px;
      background: #0b1228;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
      flex-shrink: 0;
    }

    .team-avatar-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .team-name {
      font-size: 1.05rem;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .team-role {
      display: inline-block;
      font-size: 0.74rem;
      font-family: var(--font-mono);
      color: var(--neon-cyan);
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.2);
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
      max-width: 100%;
    }

    .team-degree {
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    /* Modal for Interactive Videos/Images */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(2, 4, 10, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-content {
      background: var(--bg-secondary);
      border: 1px solid var(--border-active);
      border-radius: var(--radius-lg);
      max-width: 860px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.3);
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .modal-title {
      font-size: 1.15rem;
      color: #ffffff;
      padding-right: 16px;
    }

    .modal-close-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.6rem;
      cursor: pointer;
      line-height: 1;
      padding: 6px 10px;
      border-radius: 6px;
    }

    .modal-close-btn:hover {
      color: var(--neon-magenta);
      background: rgba(255, 0, 127, 0.1);
    }

    .modal-body {
      padding: 16px;
    }

    .modal-media-box {
      width: 100%;
      background: #000000;
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .modal-media-box video, .modal-media-box img {
      width: 100%;
      max-height: 520px;
      display: block;
      object-fit: contain;
    }

    /* Footer */
    footer {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 30px 0;
      text-align: center;
      background: #02040a;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>

      function Navbar() {

        }

          e('div', { className: 'container' },
            e('div', { className: 'nav-inner' },
              e('a', { href: '#', className: 'brand-logo' },
                e('div', { className: 'brand-icon' }, 'S'),

                  e('span', null, 'UCEVA')

              e('nav', null,
                e('ul', { className: 'nav-links' },

      function Proyectos(props) {
        const [filter, setFilter] = useState('TODOS');
        const categories = [
          'TODOS',
          'PROYECTOS VR',
          'PROYECTOS AR',
          'PROYECTOS MR',
          'PROYECTOS 360°',
          'PROYECTOS FOTOGRAMETRÍA',
          'PROYECTOS PROTOTIPADO AERONÁUTICO',
          'PROYECTOS ELECTRÓNICOS',
          'PROYECTOS IA',
          'PROYECTOS DE DISEÑO'
        ];

        const filtered = filter === 'TODOS' ? PRESENTATION.proyectos : PRESENTATION.proyectos.filter(function(p) {
          return p.category === filter;
        });

        return e('section', { id: 'proyectos' },
          e('div', { className: 'container' },
            e('div', { className: 'section-header' },
              e('span', { className: 'section-tag' }, 'Diapositivas 12 a 25'),
              e('h2', { className: 'section-title' }, 'Proyectos de ', e('span', { className: 'text-gradient' }, 'Desarrollo'))
            ),
            e('div', { className: 'filter-container' },
              categories.map(function(cat, idx) {
                return e('button', {
                  key: idx,
                  className: 'filter-btn' + (filter === cat ? ' active' : ''),
                  onClick: function() { setFilter(cat); }
                }, cat.replace('PROYECTOS ', ''));
              })
            ),
            e('div', { className: 'cards-grid' },
              filtered.map(function(proj, idx) {
                return e('div', { key: idx, className: 'card-item' },
                  e('div', { className: 'card-media-wrapper' },
                    e('img', { src: proj.image, alt: proj.title, loading: 'lazy' }),
                    e('span', { className: 'card-media-badge' }, 'Diapositiva ' + proj.slide)
                  ),
                  e('div', { className: 'card-body' },
                    e('div', null,
                      e('div', { className: 'card-category' }, proj.category),
                      e('h3', { className: 'card-title' }, proj.title)
                    ),
                    (proj.video || proj.gif) ? e('button', {
                      className: 'card-action-btn',
                      onClick: function() { props.onOpenModal(proj); }
                    }, '▶ Ver Video / Interactivo') : e('button', {
                      className: 'card-action-btn',
                      onClick: function() { props.onOpenModal(proj); }
                    }, '🔍 Ver Lámina Completa')
                  )
                );
              })
            )
          )
        );
      }

      function Modal(props) {
        const item = props.item;
        if (!item) return null;

        return e('div', { className: 'modal-overlay', onClick: props.onClose },
          e('div', { className: 'modal-content', onClick: function(ev) { ev.stopPropagation(); } },
            e('div', { className: 'modal-header' },
              e('h3', { className: 'modal-title' }, item.title),
              e('button', { className: 'modal-close-btn', onClick: props.onClose }, '✕')
            ),
            e('div', { className: 'modal-body' },
              item.video ? e('div', { className: 'modal-media-box' },
                e('video', {
                  src: item.video,
                  controls: true,
                  autoPlay: true,
                  playsInline: true,
                  style: { width: '100%', borderRadius: '8px' }
                })
              ) : e('div', { className: 'modal-media-box' },
                e('img', { src: item.image, alt: item.title, style: { width: '100%', borderRadius: '8px' } })
              )
            )
          )
        );
      }

      function Footer() {
        return e('footer', null,

            e('p', null, 'Centro de Prototipado & STEAM — Unidad Central del Valle del Cauca (UCEVA)')

        );

            e(Proyectos, { onOpenModal: function(it) { setModalItem(it); } }),

          e(Footer),
