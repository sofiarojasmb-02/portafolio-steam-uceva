  <style>
/* ==========================================================================
   DESIGN SYSTEM - CENTRO DE PROTOTIPADO & STEAM UCEVA
   Estética: Dark Tech, Neón Cyan -> Magenta -> Naranja, Hexagonal & Glass
   ========================================================================== */

:root {
  /* Color Palette - Neon Cyber Dark */
  --bg-primary: #040711;
  --bg-secondary: #080d1e;
  --bg-tertiary: #0e152e;
  --bg-card: rgba(14, 21, 46, 0.7);
  --bg-card-hover: rgba(20, 31, 68, 0.85);
  --bg-glass: rgba(10, 16, 35, 0.65);
  --bg-glass-heavy: rgba(5, 9, 22, 0.92);

  /* Neon Gradients & Accents */
  --neon-cyan: #00f0ff;
  --neon-cyan-glow: rgba(0, 240, 255, 0.4);
  --neon-purple: #9d00ff;
  --neon-magenta: #ff007f;
  --neon-magenta-glow: rgba(255, 0, 127, 0.4);
  --neon-orange: #ff5500;
  --neon-orange-glow: rgba(255, 85, 0, 0.4);
  --neon-green: #00ff88;

  /* Gradients */
  --grad-primary: linear-gradient(135deg, #00f0ff 0%, #9d00ff 50%, #ff007f 100%);
  --grad-warm: linear-gradient(135deg, #ff007f 0%, #ff5500 100%);
  --grad-cyan-purple: linear-gradient(135deg, #00f0ff 0%, #9d00ff 100%);
  --grad-dark-card: linear-gradient(180deg, rgba(20, 30, 65, 0.6) 0%, rgba(8, 14, 32, 0.9) 100%);
  --grad-glow-border: linear-gradient(135deg, rgba(0, 240, 255, 0.6), rgba(157, 0, 255, 0.6), rgba(255, 0, 127, 0.6));

  /* Typography */
  --text-main: #f0f4fc;
  --text-secondary: #a2b4d6;
  --text-muted: #62749d;
  --text-cyan: #00f0ff;
  --text-magenta: #ff4da6;

  /* Fonts */
  --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-display: 'Outfit', 'Space Grotesk', var(--font-sans);
  --font-mono: 'JetBrains Mono', monospace;

  /* Borders & Shadows */
  --border-subtle: rgba(0, 240, 255, 0.15);
  --border-active: rgba(0, 240, 255, 0.5);
  --shadow-neon-cyan: 0 0 25px rgba(0, 240, 255, 0.25);
  --shadow-neon-magenta: 0 0 25px rgba(255, 0, 127, 0.25);
  --shadow-card: 0 10px 30px -10px rgba(0, 0, 0, 0.7);

  /* Spacing & Layout */
  --nav-height: 76px;
  --container-max: 1280px;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;

  /* Transitions */
  --transition-fast: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  --transition-normal: 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  --transition-slow: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

/* ==========================================================================
   Global Reset & Base
   ========================================================================== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  color-scheme: dark;
  font-size: 16px;
}

body {
  background-color: var(--bg-primary);
  color: var(--text-main);
  font-family: var(--font-sans);
  line-height: 1.6;
  overflow-x: hidden;
  position: relative;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Futuristic background pattern */
body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-image: 
    radial-gradient(circle at 15% 20%, rgba(0, 240, 255, 0.07) 0%, transparent 40%),
    radial-gradient(circle at 85% 75%, rgba(157, 0, 255, 0.08) 0%, transparent 45%),
    radial-gradient(circle at 50% 50%, rgba(255, 0, 127, 0.05) 0%, transparent 50%),
    linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 100% 100%, 48px 48px, 48px 48px;
  pointer-events: none;
  z-index: -1;
}

/* Custom Cyber Scrollbar */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: var(--bg-primary);
}

::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, var(--neon-cyan), var(--neon-purple));
  border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
  background: linear-gradient(180deg, var(--neon-cyan), var(--neon-magenta));
}

/* Links & Typography helpers */
a {
  color: inherit;
  text-decoration: none;
  transition: color var(--transition-fast);
}

h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-display);
  font-weight: 700;
  letter-spacing: -0.02em;
  color: #ffffff;
  line-height: 1.2;
}

img, video {
  max-width: 100%;
  height: auto;
  display: block;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
}

/* ==========================================================================
   Utility Classes & Design Primitives
   ========================================================================== */
.container {
  width: 100%;
  max-width: var(--container-max);
  margin: 0 auto;
  padding: 0 24px;
}

.text-gradient {
  background: var(--grad-primary);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  display: inline-block;
}

.text-gradient-warm {
  background: var(--grad-warm);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  display: inline-block;
}

.text-cyan {
  color: var(--neon-cyan);
}

.text-magenta {
  color: var(--neon-magenta);
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 14px;
  border-radius: 30px;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  border: 1px solid var(--border-subtle);
  background: rgba(0, 240, 255, 0.06);
  color: var(--neon-cyan);
  backdrop-filter: blur(10px);
}

.badge-warm {
  border-color: rgba(255, 85, 0, 0.3);
  background: rgba(255, 85, 0, 0.08);
  color: #ff8c42;
}

.badge-purple {
  border-color: rgba(157, 0, 255, 0.3);
  background: rgba(157, 0, 255, 0.08);
  color: #c975ff;
}

.badge-green {
  border-color: rgba(0, 255, 136, 0.3);
  background: rgba(0, 255, 136, 0.08);
  color: var(--neon-green);
}

/* Glassmorphism Cards */
.glass-panel {
  background: var(--bg-card);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  transition: all var(--transition-normal);
  position: relative;
  overflow: hidden;
}

.glass-panel::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.5), transparent);
  opacity: 0.6;
}

.glass-panel:hover {
  border-color: var(--border-active);
  box-shadow: 0 14px 40px -10px rgba(0, 240, 255, 0.18), var(--shadow-card);
  transform: translateY(-4px);
}

/* Hexagonal / Cyber Accent Cut */
.tech-cut-corner {
  clip-path: polygon(
    0 0,
    calc(100% - 18px) 0,
    100% 18px,
    100% 100%,
    18px 100%,
    0 calc(100% - 18px)
  );
}

/* Buttons */
.btn-cyber-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px 28px;
  background: linear-gradient(135deg, #00f0ff 0%, #9d00ff 100%);
  color: #040711;
  font-weight: 700;
  font-size: 0.95rem;
  letter-spacing: 0.02em;
  border-radius: var(--radius-md);
  box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
  transition: all var(--transition-normal);
  position: relative;
  overflow: hidden;
}

.btn-cyber-primary:hover {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 0 30px rgba(0, 240, 255, 0.7), 0 0 15px rgba(157, 0, 255, 0.5);
  color: #000;
}

.btn-cyber-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 13px 26px;
  background: rgba(14, 21, 46, 0.8);
  border: 1px solid var(--border-active);
  color: #ffffff;
  font-weight: 600;
  font-size: 0.95rem;
  border-radius: var(--radius-md);
  backdrop-filter: blur(10px);
  transition: all var(--transition-normal);
}

.btn-cyber-secondary:hover {
  background: rgba(0, 240, 255, 0.12);
  border-color: var(--neon-cyan);
  box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
  color: var(--neon-cyan);
  transform: translateY(-2px);
}

.btn-cyber-print {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 20px;
  background: rgba(255, 0, 127, 0.12);
  border: 1px solid rgba(255, 0, 127, 0.4);
  color: #ff4da6;
  font-weight: 600;
  font-size: 0.85rem;
  border-radius: 30px;
  transition: all var(--transition-normal);
}

.btn-cyber-print:hover {
  background: rgba(255, 0, 127, 0.25);
  border-color: var(--neon-magenta);
  color: #ffffff;
  box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
  transform: translateY(-2px);
}

/* Section Header standard */
.section-header {
  text-align: center;
  margin-bottom: 56px;
  position: relative;
}

.section-header .section-subtitle {
  font-family: var(--font-mono);
  color: var(--neon-cyan);
  font-size: 0.85rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  margin-bottom: 12px;
  display: block;
}

.section-header .section-title {
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 800;
  margin-bottom: 16px;
}

.section-header .section-desc {
  max-width: 680px;
  margin: 0 auto;
  color: var(--text-secondary);
  font-size: 1.05rem;
}

/* Section padding */
section {
  padding: 96px 0;
  position: relative;
}

/* ==========================================================================
   OPCIÓN 2 DESIGN SYSTEM: LABORATORIO TECNOLÓGICO & INNOVACIÓN BENTO
   Estética: Futuristic Lab, Obsidian Slate, Laser Cyan & Hyper Indigo Accents,
   HUD Telemetry, Microinteracciones de Laboratorio y Bento Grid Dinámico
   ========================================================================== */

.theme-option2 {
  /* Palette - Lab Deep Slate */
  --lab-bg-base: #07090e;
  --lab-bg-surface: #0c1017;
  --lab-bg-card: rgba(15, 20, 31, 0.75);
  --lab-bg-card-hover: rgba(22, 30, 48, 0.9);
  --lab-bg-glass: rgba(12, 17, 27, 0.7);
  --lab-bg-glass-solid: rgba(8, 11, 18, 0.95);

  /* Lab Accents */
  --lab-accent-cyan: #00F5D4;
  --lab-accent-cyan-glow: rgba(0, 245, 212, 0.35);
  --lab-accent-indigo: #6366F1;
  --lab-accent-indigo-glow: rgba(99, 102, 241, 0.35);
  --lab-accent-amber: #F59E0B;
  --lab-accent-rose: #F43F5E;
  --lab-accent-emerald: #10B981;

  /* Gradients */
  --lab-grad-hero: linear-gradient(135deg, #00F5D4 0%, #6366F1 50%, #EC4899 100%);
  --lab-grad-glow: linear-gradient(135deg, rgba(0, 245, 212, 0.15) 0%, rgba(99, 102, 241, 0.15) 100%);
  --lab-grad-border: linear-gradient(135deg, rgba(0, 245, 212, 0.5), rgba(99, 102, 241, 0.3), rgba(244, 63, 94, 0.4));
  --lab-grad-dark-panel: linear-gradient(180deg, rgba(18, 24, 38, 0.8) 0%, rgba(10, 14, 23, 0.95) 100%);

  /* Typography */
  --lab-text-primary: #F8FAFC;
  --lab-text-secondary: #94A3B8;
  --lab-text-muted: #64748B;
  --lab-text-accent: #00F5D4;

  /* Borders & Shadows */
  --lab-border-subtle: rgba(255, 255, 255, 0.08);
  --lab-border-hover: rgba(0, 245, 212, 0.4);
  --lab-shadow-subtle: 0 10px 30px -10px rgba(0, 0, 0, 0.6);
  --lab-shadow-glow: 0 0 30px rgba(0, 245, 212, 0.2);

  /* Geometry & Layout */
  --lab-radius-sm: 8px;
  --lab-radius-md: 14px;
  --lab-radius-lg: 22px;
  --lab-radius-xl: 32px;

  background-color: var(--lab-bg-base);
  color: var(--lab-text-primary);
  font-family: var(--font-sans);
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

/* Background HUD Grid Pattern */
.theme-option2::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-image: 
    radial-gradient(circle at 20% 15%, rgba(0, 245, 212, 0.06) 0%, transparent 45%),
    radial-gradient(circle at 80% 85%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(244, 63, 94, 0.03) 0%, transparent 60%),
    linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 100% 100%, 40px 40px, 40px 40px;
  pointer-events: none;
  z-index: 0;
}

/* Floating View Switcher Bar */
.version-switcher-bar {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2500;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  background: rgba(10, 14, 24, 0.88);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(0, 245, 212, 0.35);
  border-radius: 40px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 245, 212, 0.2);
}

.version-switch-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 18px;
  border-radius: 30px;
  font-family: var(--font-mono);
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--lab-text-secondary);
  background: transparent;
  border: none;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

.version-switch-btn:hover {
  color: #ffffff;
}

.version-switch-btn.active {
  background: linear-gradient(135deg, #00F5D4, #6366F1);
  color: #07090E;
  box-shadow: 0 0 15px rgba(0, 245, 212, 0.4);
}

/* Lab Typography & Utility Elements */
.theme-option2 h1,
.theme-option2 h2,
.theme-option2 h3,
.theme-option2 h4 {
  font-family: var(--font-display);
  font-weight: 800;
  letter-spacing: -0.03em;
  color: #FFFFFF;
}

.lab-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border-radius: 30px;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  background: rgba(0, 245, 212, 0.08);
  border: 1px solid rgba(0, 245, 212, 0.3);
  color: var(--lab-accent-cyan);
  backdrop-filter: blur(10px);
}

.lab-badge-indigo {
  background: rgba(99, 102, 241, 0.1);
  border-color: rgba(99, 102, 241, 0.35);
  color: #A5B4FC;
}

.lab-badge-amber {
  background: rgba(245, 158, 11, 0.1);
  border-color: rgba(245, 158, 11, 0.35);
  color: #FCD34D;
}

.lab-text-gradient {
  background: var(--lab-grad-hero);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  display: inline-block;
}

/* HUD telemetry indicators */
.hud-corner-bracket {
  position: absolute;
  width: 12px;
  height: 12px;
  border-color: rgba(0, 245, 212, 0.4);
  pointer-events: none;
}

.hud-tl { top: 8px; left: 8px; border-top: 2px solid; border-left: 2px solid; }
.hud-tr { top: 8px; right: 8px; border-top: 2px solid; border-right: 2px solid; }
.hud-bl { bottom: 8px; left: 8px; border-bottom: 2px solid; border-left: 2px solid; }
.hud-br { bottom: 8px; right: 8px; border-bottom: 2px solid; border-right: 2px solid; }

/* ==========================================================================
   BENTO GRID & EDITORIAL SHOWCASE STYLES (OPCIÓN 2)
   ========================================================================== */

.bento-section {
  padding: 110px 0;
  position: relative;
  z-index: 1;
}

.bento-container {
  width: 100%;
  max-width: 1360px;
  margin: 0 auto;
  padding: 0 24px;
}

/* Category Quick Filter Ribbon */
.bento-filter-ribbon {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 40px;
  flex-wrap: wrap;
}

.bento-filters-group {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 6px;
  scrollbar-width: none;
}

.bento-filter-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 18px;
  border-radius: 30px;
  background: rgba(18, 24, 38, 0.7);
  border: 1px solid rgba(255, 255, 255, 0.09);
  color: var(--lab-text-secondary);
  font-size: 0.86rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.25s ease;
}

.bento-filter-pill:hover {
  border-color: var(--lab-accent-cyan);
  color: #ffffff;
  background: rgba(0, 245, 212, 0.1);
}

.bento-filter-pill.active {
  background: linear-gradient(135deg, rgba(0, 245, 212, 0.25), rgba(99, 102, 241, 0.25));
  border-color: var(--lab-accent-cyan);
  color: var(--lab-accent-cyan);
  box-shadow: 0 0 20px rgba(0, 245, 212, 0.25);
}

.bento-search-box {
  position: relative;
  min-width: 280px;
}

.bento-search-input {
  width: 100%;
  padding: 10px 16px 10px 38px;
  background: rgba(18, 24, 38, 0.8);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: var(--lab-radius-md);
  color: #ffffff;
  font-family: inherit;
  font-size: 0.9rem;
  outline: none;
  transition: border-color 0.2s;
}

.bento-search-input:focus {
  border-color: var(--lab-accent-cyan);
  box-shadow: 0 0 15px rgba(0, 245, 212, 0.2);
}

.bento-search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--lab-accent-cyan);
  pointer-events: none;
}

/* Master Bento Grid (12 Columns Architecture) */
.bento-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 24px;
  grid-auto-flow: dense;
}

/* Base Bento Card */
.bento-card {
  position: relative;
  background: var(--lab-grad-dark-panel);
  border: 1px solid var(--lab-border-subtle);
  border-radius: var(--lab-radius-lg);
  overflow: hidden;
  box-shadow: var(--lab-shadow-subtle);
  transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  flex-direction: column;
  cursor: pointer;
}

.bento-card:hover {
  border-color: var(--lab-accent-cyan);
  transform: translateY(-5px);
  box-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.8), 0 0 25px rgba(0, 245, 212, 0.2);
}

/* Card Column Spans */
.span-featured-hero {
  grid-column: span 8;
  min-height: 480px;
}

.span-featured-side {
  grid-column: span 4;
  min-height: 480px;
}

.span-wide {
  grid-column: span 6;
  min-height: 380px;
}

.span-standard {
  grid-column: span 4;
  min-height: 380px;
}

.span-telemetry {
  grid-column: span 4;
  min-height: 320px;
}

/* Media Box inside Bento */
.bento-media-container {
  position: relative;
  width: 100%;
  flex: 1;
  min-height: 220px;
  background: #04060A;
  overflow: hidden;
}

.bento-media-container img,
.bento-media-container video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

.bento-card:hover .bento-media-container img,
.bento-card:hover .bento-media-container video {
  transform: scale(1.04);
}

.bento-media-overlay-gradient {
  position: absolute;
  inset: 0;

.bento-card-content {
  padding: 24px;

  gap: 12px;

  z-index: 2;
}

                    {project.techStack.map((t, i) => (
                      <span key={i} className="drawer-tech-badge">{t}</span>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function AppOpt2() {
      const [activeDrawer, setActiveDrawer] = useState(null);
      const handlePrint = () => window.print();

      return (
        <div>
          <NavbarOpt2 onPrintPdf={handlePrint} />
          <main>
            <HeroOpt2 />
            <BentoProjectGridOpt2 projects={portfolioData.projects} onOpenProject={(p) => setActiveDrawer(p)} />
          </main>
          {activeDrawer && <ProjectDetailDrawerOpt2 project={activeDrawer} onClose={() => setActiveDrawer(null)} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root-opt2')).render(<AppOpt2 />);
  </script>
</body>
</html>
